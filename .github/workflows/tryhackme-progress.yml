name: TryHackMe public progress tracker

on:
  schedule:
    - cron: "30 17 * * *" # 23:00 India Standard Time (UTC+5:30)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: thm-progress-tracker
  cancel-in-progress: false

jobs:
  update-public-progress:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Fetch public TryHackMe progress
        run: python3 scripts/update_thm_progress.py
      - name: Commit tracker output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tryhackme-progress.json PROGRESS-HISTORY.md
          if git diff --cached --quiet; then
            echo "No progress-history changes to commit."
          else
            git commit -m "chore: refresh TryHackMe public progress"
            git push
          fi
